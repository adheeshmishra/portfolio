<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSA: base problems and what they unlock — Adheesh Mishra</title>
    <meta name="description" content="About 95 base problems carry all the transfer. Solve those cold and roughly 440 LeetCode problems become variations you can derive at the table." />
    <meta property="og:title" content="DSA: base problems and what they unlock" />
    <meta property="og:description" content="95 base problems, the invariant behind each, and the ~440 LeetCode problems they unlock." />
    <meta property="og:type" content="article" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #14201a;
        --paper: #1e2d24;
        --ink: #efe9d6;
        --ink-2: rgba(239,233,214,.78);
        --muted: #a8b39a;
        --line: rgba(220,225,200,.12);
        --line-strong: rgba(220,225,200,.22);
        --accent: #87a673;
        --serif: "Cormorant Garamond", Georgia, serif;
        --sans: "DM Sans", -apple-system, system-ui, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, monospace;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
      .wrap { max-width: 1040px; margin: 0 auto; padding: 48px clamp(16px, 5vw, 56px) 64px; }
      .back { font-family: var(--mono); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); text-decoration: none; }
      .back:hover { color: var(--ink); }
      .eyebrow { margin-top: 56px; font-family: var(--mono); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
      h1 { margin: 14px 0 0; font-family: var(--serif); font-weight: 500; font-size: clamp(40px, 6vw, 72px); line-height: 1.02; letter-spacing: -.015em; }
      h1 em { font-weight: 400; color: var(--accent); }
      .lede { margin: 22px 0 0; max-width: 640px; font-family: var(--serif); font-size: 22px; line-height: 1.5; color: var(--ink-2); }
      .actions { margin-top: 32px; display: flex; flex-wrap: wrap; gap: 12px; }
      .btn { display: inline-flex; align-items: center; gap: 12px; padding: 15px 24px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--ink); text-decoration: none; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; transition: background .25s, color .25s, border-color .25s; }
      .btn:hover { background: var(--ink); color: var(--bg); border-color: var(--ink); }
      .btn-solid { background: var(--ink); color: var(--bg); border-color: var(--ink); }
      .btn-solid:hover { background: var(--accent); border-color: var(--accent); }
      .viewer { margin-top: 48px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--paper); }
      .viewer object { display: block; width: 100%; height: 85vh; min-height: 520px; }
      .fallback { padding: 40px 24px; text-align: center; color: var(--muted); font-size: 15px; line-height: 1.6; }
      .fallback a { color: var(--ink); }
      footer { margin-top: 40px; font-family: var(--mono); font-size: 11px; letter-spacing: .15em; text-transform: uppercase; color: var(--muted); }
      footer a { color: var(--muted); }
    </style>
  </head>
  <body>
    <main class="wrap">
      <a class="back" href="/">← Adheesh Mishra</a>

      <div class="eyebrow">Notes · Interview prep</div>
      <h1>DSA: base problems <em>and what they unlock.</em></h1>
      <p class="lede">
        About 95 problems carry all the transfer. Solve those cold, learn the one-sentence invariant behind each, and roughly 440 LeetCode problems stop being separate problems.
      </p>

      <div class="actions">
        <a class="btn btn-solid" href="/dsa-base-problems.pdf" target="_blank" rel="noopener">Open PDF →</a>
        <a class="btn" href="/dsa-base-problems.pdf" download="DSA_base_problems_and_what_they_unlock.pdf">Download</a>
      </div>

      <div class="viewer">
        <object data="/dsa-base-problems.pdf" type="application/pdf" aria-label="DSA base problems PDF">
          <div class="fallback">
            Your browser can't show the PDF inline.<br />
            <a href="/dsa-base-problems.pdf" target="_blank" rel="noopener">Open it in a new tab</a> instead.
          </div>
        </object>
      </div>

      <footer>Shared by <a href="/">Adheesh Mishra</a></footer>
    </main>
  </body>
</html>
