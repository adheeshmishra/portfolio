<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Adheesh — Portfolio Directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; }
  body { font-family: "DM Sans", -apple-system, system-ui, sans-serif; }
  iframe { display: block; border: 0; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel">
  const W = 1440;
  const H = 900;

  function Variant({ src }) {
    return (
      <iframe
        src={src}
        width={W}
        height={H}
        style={{ width: W, height: H, background: '#efe9d6' }}
        scrolling="yes"
        title={src}
      />
    );
  }

  function App() {
    return (
      <DesignCanvas>
        <DCSection
          id="portfolio"
          title="Portfolio — three directions"
          subtitle="Same SE profile, same cream-and-forest palette, different temperaments. Click any artboard to enter focus mode; scroll inside each.">
          <DCArtboard id="v1" label="A · Editorial Calm" width={W} height={H}>
            <Variant src="variations/v1-editorial.html" />
          </DCArtboard>
          <DCArtboard id="v2" label="B · Terminal Garden" width={W} height={H}>
            <Variant src="variations/v2-terminal.html" />
          </DCArtboard>
          <DCArtboard id="v3" label="C · Brutal Cream" width={W} height={H}>
            <Variant src="variations/v3-brutal.html" />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
